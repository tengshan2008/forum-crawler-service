services:
  # MongoDB Database
  mongo:
    image: mongo:4.4.18
    container_name: forum-crawler-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - forum-crawler-network
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: forum-crawler-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - forum-crawler-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: forum-crawler-backend
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:admin123@mongo:27017/forum-crawler?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: http://localhost:3000
      # JWT 密钥必须由部署方提供（docker/.env 或环境变量），缺失时 compose 直接报错，
      # 避免容器以弱默认密钥启动。生成方式：openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?请在 docker/.env 或环境变量中设置强随机 JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请在 docker/.env 或环境变量中设置强随机 JWT_REFRESH_SECRET}
    ports:
      - "5000:5000"
    volumes:
      - public_images:/app/public/images
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forum-crawler-network

  # Frontend Web UI
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: forum-crawler-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - forum-crawler-network
    # 前端不注入 API 地址：浏览器端默认使用相对路径 /api，
    # 由 nginx 将 /api 反向代理到 backend（直连 5000 会被 CORS 白名单拒绝）

volumes:
  mongo_data:
  redis_data:
  public_images:


networks:
  forum-crawler-network:
    driver: bridge
