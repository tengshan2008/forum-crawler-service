services:
  # MongoDB Database
  mongo:
    # image: arm64v8/mongo:4.4.18
    image: mongo:4.4.18
    container_name: forum-crawler-mongo-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - forum-crawler-network-dev
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: forum-crawler-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - forum-crawler-network-dev
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend.dev
    container_name: forum-crawler-backend-dev
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:admin123@mongo:27017/forum-crawler?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: "*"
      # JWT 密钥必须由部署方提供（docker/.env 或宿主环境变量），缺失时 compose 直接报错，
      # 避免容器启动后被 config.validateEnv() fail-fast 拦截反复重启。
      # 生成方式：openssl rand -hex 32
      JWT_SECRET: ${JWT_SECRET:?请在 docker/.env 或环境变量中设置强随机 JWT_SECRET（openssl rand -hex 32）}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?请在 docker/.env 或环境变量中设置强随机 JWT_REFRESH_SECRET（openssl rand -hex 32）}
    ports:
      - "5000:5000"
    volumes:
      - public_images:/app/public/images
      - ../backend/scripts:/app/backend/scripts
      - ../backend/src:/app/backend/src
      - ../backend/package*.json:/app/backend/
      - ../crawler:/app/crawler
      - /app/backend/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - forum-crawler-network-dev

  # Frontend Web UI
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend.dev
    container_name: forum-crawler-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ../frontend/index.html:/app/frontend/index.html
      - ../frontend/vite.config.js:/app/frontend/vite.config.js
      - ../frontend/src:/app/frontend/src
      - ../frontend/public:/app/frontend/public
      - /app/frontend/node_modules
    command: npm run dev
    stdin_open: true
    tty: true
    depends_on:
      - backend
    networks:
      - forum-crawler-network-dev
    environment:
      # 开发环境：Vite 开发服务器把 /api 代理到容器网络内的 backend
      VITE_PROXY_TARGET: http://backend:5000
      VITE_USE_POLLING: "1" # Docker/挂载卷下文件监听需要轮询才能触发 HMR

volumes:
  mongo_data:
  redis_data:
  public_images:

networks:
  forum-crawler-network-dev:
    driver: bridge
