name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Jest 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npm test

  crawler-tests:
    name: Crawler Pytest 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 爬虫单测仅覆盖 lib/ 纯函数与文本解析，只需轻量依赖
      - name: 安装 uv 与 Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 创建虚拟环境并安装测试依赖
        run: |
          uv venv
          uv pip install "beautifulsoup4==4.12.2" pytest

      - name: 运行单元测试
        run: uv run pytest
